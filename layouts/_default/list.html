{{- define "main" }}

<header class="page-header">
  {{- partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{- if .Description }}
  <div class="post-description">{{ .Description | markdownify }}</div>
  {{- end }}
</header>

{{- $pages := .RegularPages.ByDate.Reverse }}

{{- partial "blog-archive.html" $pages }}

{{- end }}
