baseURL: "https://avradeep.com/"
title: Avradeep Bhattacharya
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

markup:
  goldmark:
    renderer:
      unsafe: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Avradeep Bhattacharya
  description: "A brief description of your site"
  keywords: [Blog, Portfolio, Personal]
  author: Avradeep Bhattacharya
  DateFormat: "January 2, 2006"
  defaultTheme: auto # auto, light, or dark
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  mainSections: ["blog"]

  assets:
    favicon: "/images/favicon.ico"

  # Home page info (shows on your landing page)
  homeInfoParams:
    Title: "Hi there!"
    Content: >
      There are a lot of things that interest me, mostly security and engineering. But whatever they maybe, I write about them here.

  # Social icons on the home page
  socialIcons:
    - name: github
      url: "https://github.com/Boredtoolbox"
    - name: threads
      url: "https://www.threads.com/@avradeep"
    - name: x
      url: "https://x.com/BoredToolbox"
    - name: linkedin
      url: "https://www.linkedin.com/in/avradeep/"
    - name: mastodon
      url: "https://ioc.exchange/@boredtoolbox"
    - name: email
      url: "mailto:iamavradeep@gmail.com"

# Navigation menu (the links at the top of every page)
menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 10
    - identifier: security-engineering
      name: Security Engineering
      url: /security-engineering/
      weight: 15
    - identifier: about
      name: About Me
      url: /about/
      weight: 20
    - identifier: links
      name: Links
      url: /links/
      weight: 30

# Output formats (needed for search and RSS)
outputs:
  home:
    - HTML
    - RSS
    - JSON